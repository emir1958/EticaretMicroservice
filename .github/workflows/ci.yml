name: CI

on:
  push:
    branches: [master, Emir]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EticaretMicroservice.sln

      - name: Build
        id: build
        run: dotnet build EticaretMicroservice.sln -c Release --no-restore

      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/EticaretMicroservice.UnitTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Order integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/EticaretMicroservice.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Stock integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/EticaretMicroservice.Stock.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Payment integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/EticaretMicroservice.Payment.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/Clients/ecommerce-ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Clients/ecommerce-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000
