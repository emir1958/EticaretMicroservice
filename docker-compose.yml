services:

  # 🟢 OpenTelemetry Aspire Dashboard
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.0
    container_name: aspire_dashboard
    ports:
      - "18888:18888" # Web UI (Kullanıcı Paneli)
      - "4317:4317"   # OTLP gRPC Portu (Trace verilerinin aktığı yer)
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    networks:
      - microservice-network

  # 1️⃣ SQL Server Sunucusu
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    environment:
      - ACCEPT_EULA=Y
      - "SA_PASSWORD=Password12*!"
    ports:
      - "1435:1433"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password12*!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2️⃣ MongoDB (Catalog API için)
  mongodb:
    image: mongo:latest
    container_name: mongodb_db
    ports:
      - "27017:27017"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3️⃣ RabbitMQ Mesaj Kuyruğu
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_bus
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4️⃣ Redis Cache (Basket API için)
  redis:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5️⃣ # 5️⃣ Identity.Api
  identity.api:
    container_name: identity_api_service
    build:
      context: .
      dockerfile: src/Services/Identity/EticaretMicroservice.Identity.Api/Dockerfile
    ports:
      - "5243:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IdentityDb;User Id=sa;Password=Password12*!;TrustServerCertificate=True;
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317
    depends_on:
      sqlserver:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 6️⃣ Catalog.Api
  catalog.api:
    container_name: catalog_api_service
    build:
      context: .
      dockerfile: src/Services/Catalog/EticaretMicroservice.Catalog.Api/Dockerfile
    ports:
      - "5113:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseSettings__ConnectionString=mongodb://mongodb:27017
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317 # 👈 Ekledi
    depends_on:
      mongodb:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 7️⃣ Basket.Api
  basket.api:
    container_name: basket_api_service
    build:
      context: .
      dockerfile: src/Services/Basket/EticaretMicroservice.Basket.Api/Dockerfile
    ports:
      - "5290:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317 # 👈 Ekledi
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 8️⃣ Order.WebApi
  order.webapi:
    container_name: order_webapi_service
    build:
      context: .
      dockerfile: src/Services/Order/EticaretMicroservice.Services.Order.WebApi/Dockerfile
    ports:
      - "5051:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=OrderDb;User Id=sa;Password=Password12*!;TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 9️⃣ Stock.Api
  stock.api:
    container_name: stock_api_service
    build:
      context: .
      dockerfile: src/Services/Stock/EticaretMicroservice.Stock.Api/Dockerfile
    ports:
      - "5027:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=StockDb;User Id=sa;Password=Password12*!;TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 🔟 Payment.Api
  payment.api:
    container_name: payment_api_service
    build:
      context: .
      dockerfile: src/Services/Payment/EticaretMicroservice.Payment.Api/Dockerfile
    ports:
      - "5295:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317 # 👈 Ekledi
    depends_on:
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started # 👈 Ekledi
    networks:
      - microservice-network

  # 1️⃣1️⃣ Gateway
  eticaretmicroservice.gateway:
    container_name: yarp_gateway_service
    build:
      context: .
      dockerfile: src/Services/Gateway/EticaretMicroservice.Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:4317
    depends_on:
      - identity.api
      - catalog.api
      - basket.api
      - order.webapi
      - stock.api
      - payment.api
      - aspire-dashboard
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge