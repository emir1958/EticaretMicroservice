services:

  # 🟢 OpenTelemetry Aspire Dashboard
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.0
    container_name: aspire_dashboard
    ports:
      - "18888:18888" # Dashboard UI
      - "4317:18889" # Container içi 18889 (gRPC), dışarıya/ağa 4317
      - "4318:18890" # Container içi 18890 (HTTP), dışarıya/ağa 4318
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
      - DASHBOARD__OTLP__AUTHMODE=Unsecured
      - DASHBOARD__OTLP__GRPCENDPOINTURL=http://0.0.0.0:18889
      - DASHBOARD__OTLP__HTTPENDPOINTURL=http://0.0.0.0:18890
      - DASHBOARD__TELEMETRYLIMITS__MAXLOGCOUNT=10000
    networks:
      - microservice-network

  # 1️⃣ SQL Server Sunucusu
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:-Password12*!}
    ports:
      - "1435:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_SA_PASSWORD:-Password12*!}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2️⃣ MongoDB (Catalog API için)
  mongodb:
    image: mongo:7.0
    container_name: mongodb_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3️⃣ RabbitMQ Mesaj Kuyruğu
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq_bus
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4️⃣ Redis Cache (Basket API için)
  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5️⃣ Identity.Api
  identity.api:
    container_name: identity_api_service
    build:
      context: .
      dockerfile: src/Services/Identity/EticaretMicroservice.Identity.Api/Dockerfile
    ports:
      - "5243:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IdentityDb;User Id=sa;Password=${SQL_SA_PASSWORD:-Password12*!};TrustServerCertificate=True;
      - Jwt__SecretKey=${JWT_SECRET_KEY:-EmirEken_Super_Secret_Microservice_Key_2026_Secure_Key_!}
      - Jwt__Issuer=${JWT_ISSUER:-EticaretIdentityServer}
      - Jwt__Audience=${JWT_AUDIENCE:-EticaretGateway}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true 
      - OTEL_LOGS_EXPORTER=otlp 
    depends_on:
      sqlserver:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 6️⃣ Catalog.Api
  catalog.api:
    container_name: catalog_api_service
    build:
      context: .
      dockerfile: src/Services/Catalog/EticaretMicroservice.Catalog.Api/Dockerfile
    ports:
      - "5113:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseSettings__ConnectionString=mongodb://mongodb:27017
      - DatabaseSettings__DatabaseName=CatalogDb
      - DatabaseSettings__CollectionName=Products
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-EmirEken_Super_Secret_Microservice_Key_2026_Secure_Key_!}
      - Jwt__Issuer=${JWT_ISSUER:-EticaretIdentityServer}
      - Jwt__Audience=${JWT_AUDIENCE:-EticaretGateway}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_LOGS_EXPORTER=otlp # 🟢 Eklendi
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 7️⃣ Basket.Api
  basket.api:
    container_name: basket_api_service
    build:
      context: .
      dockerfile: src/Services/Basket/EticaretMicroservice.Basket.Api/Dockerfile
    ports:
      - "5290:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-EmirEken_Super_Secret_Microservice_Key_2026_Secure_Key_!}
      - Jwt__Issuer=${JWT_ISSUER:-EticaretIdentityServer}
      - Jwt__Audience=${JWT_AUDIENCE:-EticaretGateway}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_LOGS_EXPORTER=otlp # 🟢 Eklendi
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 8️⃣ Order.WebApi
  order.webapi:
    container_name: order_webapi_service
    build:
      context: .
      dockerfile: src/Services/Order/EticaretMicroservice.Services.Order.WebApi/Dockerfile
    ports:
      - "5051:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=OrderDb;User Id=sa;Password=${SQL_SA_PASSWORD:-Password12*!};TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-EmirEken_Super_Secret_Microservice_Key_2026_Secure_Key_!}
      - Jwt__Issuer=${JWT_ISSUER:-EticaretIdentityServer}
      - Jwt__Audience=${JWT_AUDIENCE:-EticaretGateway}
      - ServiceUrls__Catalog=http://catalog.api:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true 
      - OTEL_SERVICE_NAME=order-service
      - OTEL_LOGS_EXPORTER=otlp # 🟢 Eklendi
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=1 
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 9️⃣ Stock.Api
  stock.api:
    container_name: stock_api_service
    build:
      context: .
      dockerfile: src/Services/Stock/EticaretMicroservice.Stock.Api/Dockerfile
    ports:
      - "5027:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=StockDb;User Id=sa;Password=${SQL_SA_PASSWORD:-Password12*!};TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-EmirEken_Super_Secret_Microservice_Key_2026_Secure_Key_!}
      - Jwt__Issuer=${JWT_ISSUER:-EticaretIdentityServer}
      - Jwt__Audience=${JWT_AUDIENCE:-EticaretGateway}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true 
      - OTEL_SERVICE_NAME=stock-service
      - OTEL_LOGS_EXPORTER=otlp
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=1
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 🔟 Payment.Api
  payment.api:
    container_name: payment_api_service
    build:
      context: .
      dockerfile: src/Services/Payment/EticaretMicroservice.Payment.Api/Dockerfile
    ports:
      - "5295:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PaymentDb;User Id=sa;Password=${SQL_SA_PASSWORD:-Password12*!};TrustServerCertificate=True;
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASS:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true # 🟢 Eksikti eklendi
      - OTEL_SERVICE_NAME=payment-service 
      - OTEL_LOGS_EXPORTER=otlp 
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=1 
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - microservice-network

  # 1️⃣1️⃣ Gateway (YARP)
  eticaretmicroservice.gateway:
    container_name: yarp_gateway_service
    build:
      context: .
      dockerfile: src/Services/Gateway/EticaretMicroservice.Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_SERVICE_NAME=gateway-service 
      - OTEL_LOGS_EXPORTER=otlp # 🟢 Eklendi
    depends_on:
      - identity.api
      - catalog.api
      - basket.api
      - order.webapi
      - stock.api
      - payment.api
      - aspire-dashboard
    networks:
      - microservice-network

volumes:
  mssql_data:
  mongo_data:
  rabbitmq_data:
  redis_data:

networks:
  microservice-network:
    driver: bridge